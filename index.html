<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>週案</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:#f5f6fa;min-height:100vh;color:#1a1a2e;}

/* ── ヘッダー ── */
.app-header{background:#fff;border-bottom:1px solid #e8eaf0;padding:0 12px;position:sticky;top:0;z-index:50;}
.header-top{display:flex;align-items:center;gap:6px;height:52px;overflow:hidden;}
.app-icon{width:32px;height:32px;background:#2563eb;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.app-name{font-weight:800;font-size:16px;color:#1a1a2e;flex:1;min-width:0;}
.hbtn{background:none;border:1px solid #e2e8f0;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:11px;color:#64748b;font-weight:600;display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;}
.hbtn:hover{background:#f8fafc;}
.hbtn.danger{color:#ef4444;border-color:#fecaca;}

/* ── 週ナビゲーション ── */
.week-nav{background:#fff;border-bottom:1px solid #e8eaf0;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.nav-arrow{width:32px;height:32px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#475569;}
.nav-arrow:hover{background:#f1f5f9;}
.week-range{display:flex;align-items:center;gap:4px;background:#f1f5f9;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid #e2e8f0;}
.week-range-icon{font-size:14px;}
.week-range-text{font-weight:700;font-size:13px;color:#1e293b;}
.nav-right{margin-left:auto;display:flex;gap:6px;align-items:center;}
.color-btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;}
.color-btn.active{background:#2563eb;color:#fff;}
.color-btn.inactive{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0;}
.print-btn{width:32px;height:32px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}

/* ── メイン ── */
.main{max-width:700px;margin:0 auto;padding:12px 12px 40px;}

/* ── 設定行 ── */
.settings-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;}
.settings-row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;}
.settings-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:80px;}
.settings-label{font-size:11px;color:#94a3b8;font-weight:600;}
.settings-input{padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;font-family:inherit;width:100%;background:#fafafa;}
.settings-input:focus{border-color:#2563eb;background:#fff;}

/* ── 時間割カード ── */
.timetable-card{background:#f7f9fc;border-radius:14px;padding:8px 8px 6px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;}
.tt-toolbar{padding:10px 14px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.tt-title{font-weight:800;font-size:14px;color:#1a1a2e;margin-right:6px;}
.tt-btn{background:none;border:none;cursor:pointer;font-size:11px;color:#94a3b8;padding:4px 6px;border-radius:6px;display:flex;align-items:center;gap:3px;font-weight:600;}
.tt-btn:hover{background:#f1f5f9;color:#475569;}
.tt-btn svg{width:13px;height:13px;}
.overflow-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
/* テーブル: border-separate で各セルに角丸・間隔 */
table{width:100%;border-collapse:separate;border-spacing:3px;font-size:11px;}
th{padding:6px 4px;text-align:center;font-size:11px;font-weight:700;background:#f0f4fb;border-radius:8px;border:none;}
th:first-child{background:#e8edf5;}
td{text-align:center;vertical-align:middle;border:none;}
.period-th{width:36px;background:#e8edf5;color:#94a3b8;font-size:11px;font-weight:700;border-radius:8px;}
.period-td{background:#f0f4fb;color:#94a3b8;font-weight:700;font-size:11px;border-radius:8px;padding:4px 2px;}
.morning-td{height:34px;cursor:pointer;transition:all 0.15s;border-radius:10px;overflow:hidden;}
.morning-td:hover{filter:brightness(0.92);transform:scale(0.97);}
.morning-td:active{filter:brightness(0.85);transform:scale(0.94);}
/* 空の朝自習セルに点線枠 */
.morning-td.empty{border:1.5px dashed #e2e8f0;background:#fffbeb !important;}
.cell-td{min-height:58px;height:auto;cursor:pointer;transition:all 0.15s;border-radius:12px;overflow:hidden;}
.cell-td:hover{filter:brightness(0.92);transform:scale(0.97);}
.cell-td:active{filter:brightness(0.85);transform:scale(0.94);}
/* 空セルに点線枠 */
.cell-td.empty{min-height:58px;border:1.5px dashed #e2e8f0;background:#fff !important;}
.cell-inner{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:58px;gap:1px;padding:4px 3px;}
.cell-name{font-size:11px;font-weight:800;line-height:1;flex-shrink:0;width:100%;text-align:center;}
.cell-unit{font-size:8.5px;opacity:0.95;width:100%;word-break:break-all;white-space:pre-wrap;line-height:1.35;text-align:left;padding:0 2px;font-family:'Helvetica Neue','Arial','Hiragino Kaku Gothic ProN',sans-serif;}
.cell-note{font-size:7.5px;opacity:0.82;width:100%;word-break:break-all;white-space:pre-wrap;line-height:1.35;text-align:left;padding:0 2px;font-family:'Helvetica Neue','Arial','Hiragino Kaku Gothic ProN',sans-serif;}
.cell-plus{font-size:18px;color:#d1d8e4;}
.morning-inner{height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}

/* ── メモカード ── */
.memo-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;overflow:hidden;}
.memo-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.memo-title{font-weight:700;font-size:14px;color:#1a1a2e;}
.memo-chevron{font-size:12px;color:#94a3b8;transition:transform 0.2s;}
.memo-body{padding:0 16px 14px;}
.memo-textarea{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;resize:none;outline:none;font-family:inherit;background:#fafafa;min-height:72px;}
.memo-textarea:focus{border-color:#2563eb;background:#fff;}

/* ── 時数集計カード ── */
.count-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;overflow:hidden;}
.count-header{padding:12px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.count-header-icon{font-size:15px;}
.count-header-title{font-weight:700;font-size:14px;color:#1a1a2e;}
.count-header-badge{background:#eef2ff;color:#2563eb;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
.count-header-total{margin-left:auto;font-size:13px;font-weight:700;color:#1a1a2e;}
.count-header-chevron{font-size:12px;color:#94a3b8;transition:transform 0.2s;}
.count-body{padding:0 16px 16px;}
.count-mode-tabs{display:flex;gap:6px;margin-bottom:12px;}
.cmt{padding:7px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:13px;transition:all 0.15s;}
.cmt.on{background:#2563eb;color:#fff;}
.cmt.off{background:#f1f5f9;color:#64748b;}
.month-selects{display:flex;align-items:center;gap:6px;margin-bottom:12px;}
.month-sel{padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;outline:none;background:#fafafa;font-weight:600;}
.month-weeks-label{font-size:11px;color:#94a3b8;font-weight:600;}
.custom-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.custom-row input[type=date]{padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:12px;outline:none;background:#fafafa;}
.custom-row label{font-size:12px;color:#64748b;font-weight:600;}
.custom-weeks-label{font-size:11px;color:#94a3b8;font-weight:600;}
.count-summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:4px;}
.count-summary-label{font-size:11px;color:#94a3b8;font-weight:600;}
.count-summary-val{font-size:12px;color:#475569;font-weight:600;}
/* 集計グリッド表 */
.ct-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #e8eaf0;border-radius:10px;overflow:hidden;}
.ct-cell{display:flex;align-items:center;gap:6px;padding:6px 8px;border-right:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;background:#fff;}
.ct-cell:nth-child(4n){border-right:none;}
.ct-cell:nth-last-child(-n+4){border-bottom:none;}
/* 国語（朝自習あり）は2列分 */
.ct-cell.kokugo-wide{grid-column:span 2;}
.ct-icon{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0;}
.ct-info{flex:1;min-width:0;}
.ct-name{font-size:10px;font-weight:700;color:#1a1a2e;line-height:1.2;}
.ct-h{font-size:13px;font-weight:900;color:#1a1a2e;line-height:1;}
.ct-sub{font-size:9px;color:#94a3b8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ct-morning-txt{font-size:9px;font-weight:700;}
.count-note{font-size:9px;color:#94a3b8;margin-top:8px;padding-top:6px;border-top:1px solid #f1f5f9;}
.count-empty{font-size:12px;color:#94a3b8;text-align:center;padding:12px 0;}

.export-menu-toggle{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:600;color:#1a1a2e;cursor:pointer;width:100%;}
.export-menu-toggle input{width:16px;height:16px;cursor:pointer;accent-color:#1e3a5f;}

/* 曜日別備考カード */
.remarks-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;padding:14px 16px;}
.remarks-title{font-size:13px;font-weight:700;color:#1a1a2e;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.remarks-grid{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.remarks-day{flex:0 0 auto;width:130px;}
.remarks-day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.remarks-day-label{font-size:11px;font-weight:700;color:#1e3a5f;}
.remarks-day-date{font-size:10px;color:#94a3b8;}
.remarks-day-holiday{font-size:10px;color:#ef4444;font-weight:700;}
.remarks-textarea{width:100%;padding:7px 9px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:11px;resize:none;outline:none;font-family:inherit;background:#fafafa;min-height:62px;line-height:1.5;}
.remarks-textarea:focus{border-color:#2563eb;background:#fff;}
.remarks-textarea.holiday-bg{background:#fff5f5;border-color:#fecaca;}

/* 祝日セル */
.cell-td.holiday{cursor:default;}
.cell-td.holiday-editable{cursor:pointer;}

/* 設定カードに第N週表示 */
.week-num-badge{background:#eef2ff;color:#2563eb;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:8px;}

/* ── 基本時間割バナー ── */
.base-tt-banner{background:linear-gradient(135deg,#eef2ff,#e0f2fe);border:1px solid #c7d2fe;border-radius:14px;padding:13px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.base-tt-banner-text{font-size:13px;font-weight:700;color:#1e3a5f;flex:1;}
.base-tt-banner-sub{font-size:11px;color:#64748b;font-weight:400;}
.base-tt-btn-yes{background:#1e3a5f;color:#fff;border:none;border-radius:9px;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;}
.base-tt-btn-no{background:#f1f5f9;color:#64748b;border:none;border-radius:9px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;}

/* ── セル選択（長押しコピー）── */
.cell-td.selected{outline:3px solid #2563eb !important;outline-offset:-2px;z-index:2;position:relative;}
.morning-td.selected{outline:3px solid #2563eb !important;outline-offset:-2px;}
.cell-td.clear-selected{outline:3px solid #ef4444 !important;outline-offset:-2px;z-index:2;position:relative;}
.morning-td.clear-selected{outline:3px solid #ef4444 !important;outline-offset:-2px;}
.cell-td.paste-selected{outline:3px solid #16a34a !important;outline-offset:-2px;z-index:2;position:relative;}
.morning-td.paste-selected{outline:3px solid #16a34a !important;outline-offset:-2px;}
.cell-action-bar{border-radius:12px;padding:10px 14px;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.cell-action-bar button{border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;color:#fff;-webkit-tap-highlight-color:transparent;min-height:44px;}

/* ── 基本時間割管理モーダル ── */
.base-tt-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:300;}
.base-tt-modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom);}
.bm-handle{width:36px;height:4px;background:#e2e8f0;border-radius:2px;margin:10px auto 0;}
.bm-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;}
.bm-title{font-size:15px;font-weight:800;color:#1a1a2e;}
.bm-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;}
.bm-list{padding:0 16px 8px;}
.bm-item{border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px;overflow:hidden;}
.bm-item-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fafbfc;cursor:pointer;}
.bm-item-name{font-weight:700;font-size:13px;color:#1a1a2e;flex:1;}
.bm-item-actions{display:flex;gap:6px;}
.bm-action-btn{background:none;border:1px solid #e2e8f0;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;color:#475569;}
.bm-action-btn.primary{background:#1e3a5f;color:#fff;border-color:#1e3a5f;}
.bm-action-btn.danger{color:#ef4444;border-color:#fecaca;}
.bm-add-btn{width:calc(100%-32px);margin:4px 16px 16px;padding:12px;background:#f1f5f9;border:none;border-radius:12px;cursor:pointer;font-size:13px;font-weight:700;color:#475569;font-family:inherit;display:block;}

/* tt-btn 追加スタイル */
.tt-btn.highlight{color:#2563eb;font-weight:700;}

/* ── アクションモーダル（コピー/クリア確認）── */
.action-modal-bg{position:fixed;inset:0;z-index:800;display:none;flex-direction:column;justify-content:flex-end;pointer-events:none;}
.action-modal-bg.show{display:flex;}
.action-modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,0.3);pointer-events:none;}
.action-modal-sheet{pointer-events:auto;position:relative;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px 40px;width:100%;max-width:500px;margin:0 auto;}
.action-modal-title{font-size:11px;color:#94a3b8;font-weight:700;text-align:center;margin-bottom:12px;}
.action-modal-info{font-size:14px;font-weight:700;color:#1a1a2e;text-align:center;margin-bottom:16px;line-height:1.5;}
.action-modal-btns{display:flex;flex-direction:column;gap:10px;}
.action-modal-btns button{width:100%;padding:16px;border:none;border-radius:14px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0.1);}
.action-modal-btn-exec{background:#1e3a5f;color:#fff;}
.action-modal-btn-exec.green{background:#16a34a;}
.action-modal-btn-exec.red{background:#dc2626;}
.action-modal-btn-cancel{background:#f1f5f9;color:#64748b;}

/* ── モーダル ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0;}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:96vh;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom);}
.modal-handle{width:36px;height:4px;background:#e2e8f0;border-radius:2px;margin:10px auto 0;}
.modal-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;}
.modal-subtitle{font-size:11px;color:#94a3b8;font-weight:600;}
.modal-cell-title{font-size:14px;font-weight:800;color:#1a1a2e;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;line-height:1;}
.modal-subject-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:6px 16px 14px;}
.msb{border:2.5px solid transparent;border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform 0.1s;}
.msb:active{transform:scale(0.94);}
.msb.sel{border-color:#1a1a2e !important;}
.msb-s{font-size:18px;font-weight:800;line-height:1;}
.msb-n{font-size:8.5px;opacity:0.92;}
.modal-clear{width:calc(100% - 32px);margin:0 16px 14px;padding:11px;background:#f1f5f9;border:none;border-radius:12px;cursor:pointer;color:#64748b;font-weight:700;font-size:13px;}
.morning-note{margin:0 16px 12px;font-size:10px;color:#92400e;background:#fffbeb;border-radius:8px;padding:7px 10px;border:1px solid #fde68a;}
.detail-head{padding:8px 18px 12px;display:flex;align-items:center;gap:8px;}
.back-btn{background:#f1f5f9;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;color:#475569;font-weight:700;}
.subj-badge{border-radius:10px;padding:5px 14px;font-weight:800;font-size:14px;color:#fff;}
.detail-body{padding:0 16px 20px;display:flex;flex-direction:column;gap:12px;}
.dlabel{font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.dinput{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;font-family:inherit;background:#fafafa;}
.dinput:focus{border-color:#2563eb;background:#fff;}
.confirm-btn{width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;font-weight:800;font-size:15px;color:#fff;margin-top:4px;}

/* ── エクスポートモーダル ── */
.exp-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.exp-modal{background:#fff;border-radius:20px;width:100%;max-width:420px;padding:20px;}
.exp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.exp-title{font-weight:800;font-size:16px;color:#1a1a2e;}
.exp-tabs{display:flex;gap:6px;margin-bottom:16px;}
.etab{padding:7px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:13px;}
.etab.on{background:#1e3a5f;color:#fff;}
.etab.off{background:#f1f5f9;color:#64748b;}
.exp-desc{font-size:13px;color:#64748b;margin-bottom:14px;}
.exp-dl-btn{width:100%;padding:12px;background:#1e3a5f;color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;}
.exp-textarea{width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:11px;resize:vertical;font-family:monospace;outline:none;background:#fafafa;min-height:100px;}
.exp-err{color:#ef4444;font-size:11px;margin-top:4px;}
.exp-import-btn{width:100%;padding:12px;background:#1e3a5f;color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;margin-top:10px;}

.export-dropdown{position:relative;}
.export-main-btn{display:flex;align-items:center;padding:7px 14px;background:#1e3a5f;color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;gap:2px;}
.export-main-btn:hover{background:#1e40af;}
.export-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);min-width:160px;z-index:300;overflow:hidden;}

function dateToKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function getHoliday(d){ return HOLIDAYS[dateToKey(d)]||null; }

// 第N週計算（年度＝4月1日を含む週から数えて何週目か、月曜始まり）
function getWeekNumInMonth(mon){
  // monはその週の月曜日。その週の日曜（mon+6）までに4/1が含まれる年度を判定
  const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  // 年度開始年：この週の日曜が1〜3月なら前年度、4月以降なら当年度
  const fiscalYear = (sun.getMonth()<3) ? sun.getFullYear()-1 : sun.getFullYear();
  // 4月1日を含む週の月曜日を求める
  const apr1=new Date(fiscalYear,3,1);
  const apr1Day=apr1.getDay();
  const offsetToMon=(apr1Day===0?6:apr1Day-1);
  const firstMon=new Date(apr1);
  firstMon.setDate(apr1.getDate()-offsetToMon);
  const diffDays=Math.round((mon-firstMon)/(1000*60*60*24));
  return Math.floor(diffDays/7)+1;
}

function countPeriods(tt,ms){
  const r=new Map();
  for(const d of DAYS){
    for(const p of PERIODS){
      const c=tt[d]?.[p]||{subjectId:""};
      const id=typeof c==="string"?c:c.subjectId;
      if(!id)continue;
      if(!r.has(id))r.set(id,{n:0,m:0});
      r.get(id).n++;
    }
    if(ms[d]==="kokugo"){
      if(!r.has("kokugo"))r.set("kokugo",{n:0,m:0});
      r.get("kokugo").m++;
    }
  }
  return r;
}
function totalH(v){return v.n+v.m/3;}

// 朝自習コマ数→分数文字列  1→1/3, 2→2/3, 3→1, 4→1と1/3...
function morningFrac(m){
  if(m===0)return"";
  const full=Math.floor(m/3),rem=m%3;
  const remStr=rem===1?"1/3":rem===2?"2/3":"";
  if(full===0)return remStr;
  if(rem===0)return String(full);
  return full+"と"+remStr;
}
// 朝自習の時間数表示（分単位も）
function morningHoursDisplay(m){
  // 合計分数
  const mins=m*15;
  const fullH=Math.floor(mins/60),remM=mins%60;
  if(fullH===0)return {h:"0",min:remM+"分",frac:morningFrac(m)};
  if(remM===0)return{h:String(fullH),min:"",frac:morningFrac(m)};
  return{h:String(fullH),min:remM+"分",frac:morningFrac(m)};
}

function wkInRange(wk,start,end){
  const mon=fromKey(wk);
  const sun=new Date(mon);sun.setDate(sun.getDate()+6);
  return mon<=end&&sun>=start;
}

function getCountsForMode(){
  const mon=fromKey(weekKey);
  let startDate,endDate,labelText,weeksLabel;
  if(countMode==="week"){
    startDate=new Date(mon);
    endDate=new Date(mon);endDate.setDate(endDate.getDate()+6);
    labelText=`${mon.getMonth()+1}/${mon.getDate()}〜${endDate.getMonth()+1}/${endDate.getDate()}`;
  }else if(countMode==="month"){
    const y=parseInt(document.getElementById("monthYear")?.value||mon.getFullYear());
    const mo=parseInt(document.getElementById("monthMonth")?.value||mon.getMonth()+1);
    startDate=new Date(y,mo-1,1);
    endDate=new Date(y,mo,0);
    labelText=`${y}年${mo}月`;
  }else{
    const sv=document.getElementById("customStart")?.value;
    const ev=document.getElementById("customEnd")?.value;
    if(!sv||!ev)return{counts:new Map(),labelText:"期間を指定してください",total:0,totalN:0,totalM:0,weeksCount:0};
    startDate=new Date(sv);endDate=new Date(ev);
    if(startDate>endDate)return{counts:new Map(),labelText:"開始〜終了の順で指定してください",total:0,totalN:0,totalM:0,weeksCount:0};
    labelText=`${sv}〜${ev}`;
  }
  const allCounts=new Map();
  let weeksCount=0;
  for(const[wk,plan]of Object.entries(allData)){
    if(!wkInRange(wk,startDate,endDate))continue;
    weeksCount++;
    const c=countPeriods(plan.timetable||emptyTT(),plan.morningStudy||emptyMS());
    c.forEach((v,id)=>{
      if(!allCounts.has(id))allCounts.set(id,{n:0,m:0});
      const cur=allCounts.get(id);cur.n+=v.n;cur.m+=v.m;
    });
  }
  const total=[...allCounts.values()].reduce((s,v)=>s+totalH(v),0);
  const totalN=[...allCounts.values()].reduce((s,v)=>s+v.n,0);
  const totalM=(allCounts.get("kokugo")?.m||0);
  return{counts:allCounts,labelText,total,totalN,totalM,weeksCount};
}

  h+="</tr></thead><tbody>";

    h+=`<tr><td class="period-td">${p}</td>`;

      const raw=plan.timetable[d]?.[p]||{subjectId:""};

      const isEmpty=!cell.subjectId?"empty":"";

function renderCountPanel(){

  const totalDisp=total%1===0?total+"時間":Math.floor(total)+"と"+morningFrac(Math.round((total%1)*3))+"時間";

    document.getElementById("countContent").innerHTML=`<div class="count-empty">データがありません</div>`;
    return;
  }

  const std=GRADE_STDS.find(g=>g.g===settings.grade)||GRADE_STDS[0];
  const stdMap={kokugo:std.kokugo,sansu:std.sansu,rika:std.rika,shakai:std.shakai,eigo:std.eigo,ongaku:std.ongaku,seikatsu:std.seikatsu,dotoku:std.dotoku,sogo:std.sogo,gakukatsu:std.gakukatsu};

  // サマリー行
  let h=`<div class="count-summary">
    <span class="count-summary-label">教科別集計</span>
    <span class="count-summary-val">合計 ${total.toFixed(1)}h &nbsp;通常${totalN}コマ / 朝${totalM}日</span>
  </div>`;

  // 4列グリッド表
  h+=`<div class="ct-grid">`;
  [...counts.entries()].sort((a,b)=>totalH(b[1])-totalH(a[1])).forEach(([id,v])=>{
    const s=SM.get(id);if(!s)return;
    const th=totalH(v);
    const thFull=Math.floor(th);
    const thRem=Math.round((th-thFull)*3);
    const fracStr=thRem===1?"⅓":thRem===2?"⅔":"";
    const iconBg=colorMode==="mono"?"#64748b":s.bg;
    const isKokugoWide=(id==="kokugo"&&v.m>0);
    const morningColor=colorMode==="mono"?"#475569":"#dc2626";

    let subHtml="";
    if(isKokugoWide){
      const md=morningHoursDisplay(v.m);
      subHtml=`<span class="ct-sub">通${v.n}コマ　</span><span class="ct-morning-txt" style="color:${morningColor}">朝${md.frac}h(${v.m*15}分)</span>`;
    }else{
      subHtml=`<span class="ct-sub">通${v.n}コマ</span>`;
    }

    h+=`<div class="ct-cell${isKokugoWide?" kokugo-wide":""}">
      <div class="ct-icon" style="background:${iconBg}">${s.s}</div>
      <div class="ct-info">
        <div class="ct-name">${s.name}</div>
        <div style="display:flex;align-items:baseline;gap:1px;">
          <span class="ct-h">${thFull}${fracStr}</span><span style="font-size:9px;color:#64748b;font-weight:600;">h</span>
        </div>
        <div>${subHtml}</div>
      </div>
    </div>`;
  });
  h+=`</div>`;
  h+=`<div class="count-note">※ 通常1コマ＝1時間　朝自習15分×3回＝1時間</div>`;
  document.getElementById("countContent").innerHTML=h;
}

function addBaseTT(){

function deleteBaseTT(id){

  saveBaseTTs(list);

}

}

function renameBaseTT(id){
  const list = loadBaseTTs();
  const tt = list.find(t=>t.id===id);

  const name = prompt("新しい名前を入力してください", tt.name);
  if(!name) return;
  tt.name = name.trim();
  saveBaseTTs(list);
  renderBaseTTList();
}

function buildPrintHTML() {
  const plan = getPlan();
  const mon = fromKey(weekKey);
  const dates = weekDates(mon);
  const isMono = colorMode === "mono";
  const counts = countPeriods(plan.timetable, plan.morningStudy);
  const memoText = (plan.memo || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

  const accent   = isMono ? '#1a1a2e' : '#1e3a5f';
  const accentLt = isMono ? '#f0f0f0' : '#e8f0fb';

  function sBg(id){ if(!id)return'#fff'; const s=SM.get(id); if(!s)return'#fff'; return isMono?'#e8e8e8':s.bg; }
  function sFg(id){ if(!id)return'#000'; const s=SM.get(id); if(!s)return'#000'; return isMono?'#111':s.fg; }
  function sName(id,unit,note){
    if(!id)return''; const s=SM.get(id); if(!s)return'';
    const nm=s.name;
    // 教科名：A4サイズで読みやすいサイズに
    const nameSize = nm.length>=4 ? '9pt' : nm.length===3 ? '11pt' : '13pt';
    const sf = "'Helvetica Neue','Arial','Hiragino Kaku Gothic ProN',sans-serif";
    const n=`<span style="font-size:${nameSize};font-weight:900;line-height:1.1;letter-spacing:0.02em;display:block;text-align:center;width:100%;">${nm}</span>`;
    let u='';
    if(unit){
      const uLen=unit.length;
      const uSize = uLen>=16 ? '7pt' : uLen>=12 ? '7.5pt' : uLen>=8 ? '8pt' : uLen>=5 ? '8.5pt' : '9pt';
      u=`<span style="font-size:${uSize};font-family:${sf};font-weight:600;display:block;margin-top:2pt;line-height:1.35;max-width:30mm;word-break:break-all;white-space:normal;opacity:0.95;text-align:left;">${unit.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`;
    }
    let nt='';
    if(note){
      const ntLen=note.length;
      const ntSize = ntLen>=16 ? '6pt' : ntLen>=10 ? '6.5pt' : ntLen>=6 ? '7pt' : '7.5pt';
      nt=`<span style="font-size:${ntSize};font-family:${sf};display:block;margin-top:1.5pt;line-height:1.35;max-width:30mm;word-break:break-all;white-space:normal;opacity:0.8;text-align:left;">${note.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`;
    }
    return n+u+nt;
  }

  // ─ 曜日ヘッダー ─
  const inclWeekend = document.getElementById('exportWeekend')?.checked !== false;
  const allDayNames=['月','火','水','木','金','土','日'];
  const dayNames=inclWeekend?allDayNames:['月','火','水','木','金'];
  const allDayColors=isMono?allDayNames.map(()=>'#1a1a2e'):['#1e3a5f','#1e3a5f','#1e3a5f','#1e3a5f','#1e3a5f','#1d4ed8','#b91c1c'];
  const allDayBgs=isMono?allDayNames.map(()=>'#e8e8e8'):['#dce8f8','#dce8f8','#dce8f8','#dce8f8','#dce8f8','#dbeafe','#fee2e2'];
  const dayColors=inclWeekend?allDayColors:allDayColors.slice(0,5);
  const dayBgs=inclWeekend?allDayBgs:allDayBgs.slice(0,5);

  let thRow=`<th style="width:15mm;background:${accent};color:#fff;font-size:10pt;font-weight:800;border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};padding:4pt 2pt;text-align:center;">時限</th>`;
  dayNames.forEach((d,i)=>{
    const dt=dates[i]; const ds=(dt.getMonth()+1)+'/'+dt.getDate();
    thRow+=`<th style="background:${dayBgs[i]};color:${dayColors[i]};font-size:13pt;font-weight:900;border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};padding:4pt 2pt;line-height:1.3;text-align:center;">${d}<br><span style="font-size:9pt;font-weight:500;opacity:0.75;">${ds}</span></th>`;
  });

  // ─ 朝自習行 ─
  let morningRow=`<td style="background:${isMono?'#f0f0f0':'#fffbeb'};color:${isMono?'#555':'#92400e'};font-size:8pt;font-weight:800;border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};text-align:center;padding:2pt;line-height:1.4;">朝自習<br><span style="font-size:7pt;">15分</span></td>`;
  dayNames.forEach(d=>{
    const id=plan.morningStudy[d]||'';
    morningRow+=`<td style="background:${sBg(id||'')};color:${sFg(id||'')};font-size:11pt;font-weight:900;border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};text-align:center;height:9mm;vertical-align:middle;">${id&&SM.get(id)?SM.get(id).name:''}</td>`;
  });

  // ─ 時限行 ─
  let periodRows='';
  [1,2,3,4,5,6].forEach(p=>{
    let tds=`<td style="background:${isMono?'#f4f4f4':'#f0f5ff'};color:${isMono?'#555':accent};font-size:13pt;font-weight:900;border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};text-align:center;padding:2pt;vertical-align:middle;">${p}</td>`;
    dayNames.forEach(d=>{
      const raw=plan.timetable[d]?.[p]||{subjectId:''};
      const cell=typeof raw==='string'?{subjectId:raw}:raw;
      const bg=sBg(cell.subjectId); const fg=sFg(cell.subjectId);
      const txt=sName(cell.subjectId,cell.unitName,cell.note);
      tds+=`<td style="background:${bg};border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};vertical-align:top;min-height:27mm;padding:3pt 2pt;"><div style="display:flex;flex-direction:column;align-items:flex-start;min-height:27mm;color:${fg};padding-top:2pt;">${txt}</div></td>`;
    });
    periodRows+=`<tr>${tds}</tr>`;
  });

  // ─ 時数サマリー（2列グリッド） ─
  let summaryRows='';
  const entries=[...counts.entries()].sort((a,b)=>totalH(b[1])-totalH(a[1]));
  entries.forEach(([id,v])=>{
    const s=SM.get(id);if(!s)return;
    const th=totalH(v);
    const thF=Math.floor(th),thR=Math.round((th-thF)*3);
    const frac=thR===1?'⅓':thR===2?'⅔':'';
    const ibg=isMono?'#555':s.bg;
    let det=id==='kokugo'&&v.m>0?`通${v.n}+朝${morningFrac(v.m)}h`:`${v.n}コマ`;
    summaryRows+=`<div style="display:flex;align-items:center;gap:3pt;white-space:nowrap;">
      <div style="background:${ibg};color:#fff;border-radius:3pt;width:16pt;height:16pt;display:flex;align-items:center;justify-content:center;font-size:8pt;font-weight:900;flex-shrink:0;">${s.s}</div>
      <span style="font-size:8.5pt;color:#222;">${s.name}</span>
      <span style="font-size:9.5pt;font-weight:900;color:#111;">${thF}${frac}h</span>
      <span style="font-size:7.5pt;color:#888;">${det}</span>
    </div>`;
  });


  // ─ 備考行（印刷用）─
  let remarksRowPrint='';
  dayNames.forEach((d,i)=>{
    const dt=dates[DAYS.indexOf(d)];
    const holiday=getHoliday(dt);
    const isOverride=plan.holidayOverride[d];
    const remark=plan.dayRemarks[d]||'';
    const bg=(holiday&&!isOverride)?'#fff5f5':'#fafcff';
    const col=holiday&&!isOverride?'#ef4444':'#444';
    let txt='';
    if(holiday&&!isOverride){
      txt=holiday;
    } else if(remark){
      // 箇条書き・左詰め
      txt=remark.split('\n').filter(s=>s.trim()).map(s=>`・${s.trim()}`).join('<br>');
    }
    remarksRowPrint+=`<td style="background:${bg};border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};padding:4pt 4pt;font-size:8.5pt;font-family:'Helvetica Neue','Arial','Hiragino Kaku Gothic ProN',sans-serif;color:${col};vertical-align:top;text-align:left;min-height:22mm;height:22mm;">${txt}</td>`;
  });

  return `<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>週案 ${mon.getFullYear()}/${mon.getMonth()+1}/${mon.getDate()}</title>
<style>
@page{size:A4 portrait;margin:10mm 12mm 10mm 12mm;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
html,body{width:100%;background:#fff;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;}
table{border-collapse:collapse;width:100%;table-layout:fixed;}
@media screen{
  html{background:#64748b;}
  body{padding:12mm;}
  .page{background:#fff;width:186mm;min-height:257mm;margin:0 auto;padding:10mm 12mm;border-radius:2mm;box-shadow:0 6px 32px rgba(0,0,0,0.25);}
  .hint{width:186mm;margin:0 auto 10px;background:#1e3a5f;color:#fff;border-radius:8px;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;font-family:sans-serif;font-size:12px;}
  .hint-btn{padding:7px 16px;background:#fff;color:#1e3a5f;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:800;}
}
@media print{
  .hint{display:none!important;}
  .page{width:100%;padding:0;box-shadow:none;border-radius:0;}
}
</style>
</head><body>
<div class="hint">
  <span>🖨 印刷ダイアログで <strong>「PDFとして保存」または「用紙サイズ：A4」</strong> を選択</span>
  <button class="hint-btn" onclick="window.print()">印刷 / PDF保存</button>
</div>
<div class="page">

<!-- ヘッダー -->
<div style="display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:5pt;margin-bottom:6pt;border-bottom:2.5pt solid ${accent};">
  <div>
    <div style="font-size:22pt;font-weight:900;letter-spacing:0.1em;color:${accent};">第${getWeekNumInMonth(mon)}週　週案</div>
    <div style="display:flex;gap:14pt;margin-top:4pt;align-items:center;">
      <span style="font-size:11pt;color:#444;font-weight:700;">${mon.getFullYear()}年度</span>
      <span style="font-size:11pt;color:#444;font-weight:700;">${settings.grade}年${settings.className||'　'}組</span>
      <span style="font-size:11pt;color:#444;font-weight:700;">担任：${settings.teacherName||'　　　　　　'}</span>
    </div>
  </div>
  <div style="text-align:right;">
    <div style="font-size:13pt;font-weight:900;color:${accent};">${mon.getMonth()+1}月${mon.getDate()}日（月）〜${dates[4].getMonth()+1}月${dates[4].getDate()}日（金）</div>
  </div>
</div>

<!-- 時間割 -->
<table style="margin-bottom:6pt;table-layout:fixed;width:100%;">
  <colgroup>
    <col style="width:${dayNames.length>5?'11':'15'}mm;">
    ${dayNames.map(()=>`<col style="width:${(186-(dayNames.length>5?11:15))/dayNames.length}mm;">`).join('')}
  </colgroup>
  <thead><tr>${thRow}</tr><tr>${morningRow}</tr></thead>
  <tbody>${periodRows}
  <tr>
    <td style="background:${isMono?'#f4f4f4':'#f0f5ff'};color:${isMono?'#555':accent};font-size:11pt;font-weight:800;border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};text-align:center;padding:3pt;vertical-align:middle;">備考</td>
    ${remarksRowPrint}
  </tr>
  </tbody>
</table>

<!-- フッター：メモ＋時数 -->
<div style="border:0.5pt solid ${isMono?'#bbb':'#c5d8f0'};border-radius:3pt;padding:4pt 7pt;background:${isMono?'#fafafa':'#fafcff'};">
  <div style="display:flex;align-items:center;gap:6pt;flex-wrap:wrap;">
    <span style="font-size:7pt;font-weight:900;color:${accent};white-space:nowrap;">今週の時数</span>
    <div style="display:flex;flex-wrap:wrap;gap:2pt 8pt;">${summaryRows}</div>
  </div>
  <div style="font-size:5pt;color:#aaa;margin-top:2pt;">通常1コマ＝1h　朝15分×3＝1h</div>
</div>

</div><!-- /page -->
</body></html>`;
}

// ============================================================
// PDF出力 — html2canvas + jsPDF でスマホから直接PDFダウンロード
// ============================================================
function exportPDF(){
  document.getElementById("exportMenu").style.display="none";

  // ── 進捗表示 ──
  const overlay = document.createElement('div');
  overlay.id = 'pdf-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;font-family:sans-serif;gap:14px;';
  overlay.innerHTML = '<div style="font-size:16px;font-weight:700;">PDF生成中...</div><div style="width:200px;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;"><div id="pdf-bar" style="height:100%;width:0%;background:#60a5fa;border-radius:3px;transition:width 0.3s;"></div></div><div id="pdf-msg" style="font-size:12px;opacity:0.8;">ライブラリ読み込み中</div>';
  document.body.appendChild(overlay);
  const setProgress = (pct, msg) => {
    document.getElementById('pdf-bar').style.width = pct + '%';
    document.getElementById('pdf-msg').textContent = msg;
  };

  function loadScript(src, cb){
    if(document.querySelector('script[src="'+src+'"]')){ cb(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = cb;
    s.onerror = () => { document.body.removeChild(overlay); alert('ライブラリの読み込みに失敗しました。ネットワーク接続を確認してください。'); };
    document.head.appendChild(s);
  }

  // ── レンダリング用 div をオフスクリーンに構築（月〜金5列・大きめ文字）──
  function buildRenderDiv(){
    const isMono = colorMode === "mono";
    const plan = getPlan();
    const mon = fromKey(weekKey);
    const dates = weekDates(mon);
    const counts = countPeriods(plan.timetable, plan.morningStudy);
    const accent = isMono ? '#1a1a2e' : '#1e3a5f';
    const memoText = (plan.memo||'').replace(/\n/g,'<br>');

    function sBg(id){ if(!id)return'#fff'; const s=SM.get(id); if(!s)return'#fff'; return isMono?'#e0e0e0':s.bg; }
    function sFg(id){ if(!id)return'#000'; const s=SM.get(id); if(!s)return'#000'; return isMono?'#111':s.fg; }

    // 土日フラグ
    const inclWeekend2 = document.getElementById('exportWeekend')?.checked !== false;
    const allWDNames=['月','火','水','木','金','土','日'];
    const weekDayNames=inclWeekend2?allWDNames:['月','火','水','木','金'];
    const allWDColors=isMono?allWDNames.map(()=>'#1a1a2e'):['#1e3a5f','#1e3a5f','#1e3a5f','#1e3a5f','#1e3a5f','#1d4ed8','#b91c1c'];
    const allWDBgs=isMono?allWDNames.map(()=>'#e8e8e8'):['#dce8f8','#dce8f8','#dce8f8','#dce8f8','#dce8f8','#dbeafe','#fee2e2'];
    const weekDayColors=inclWeekend2?allWDColors:allWDColors.slice(0,5);
    const weekDayBgs=inclWeekend2?allWDBgs:allWDBgs.slice(0,5);
    const borderCol = isMono?'#bbb':'#c5d8f0';

    // B5 182×257mm, 余白8mm → 印刷領域 166×241mm
    // scale=2 でレンダリング → jsPDF で 166×241 にフィット
    const MM = 166; // 印刷幅mm
    const PX_PER_MM = 3.78;
    const SCALE = 2;
    const W = Math.round(MM * PX_PER_MM * SCALE);

    // 列幅: 時限列12mm, 残154mm÷5 = 30.8mm/列
    const periodMM = 12;
    const dayMM = (MM - periodMM) / 5;
    const periodW = Math.round(periodMM * PX_PER_MM * SCALE);
    const dayW    = Math.round(dayMM    * PX_PER_MM * SCALE);

    // 行高: 朝10mm, 時限行29mm (6行で174mm → 合計204mm, ヘッダー13mm, メモ欄24mm → 合計241mm OK)
    const morningH = Math.round(10 * PX_PER_MM * SCALE);
    const cellH    = Math.round(29 * PX_PER_MM * SCALE);
    const headerH  = Math.round(13 * PX_PER_MM * SCALE);

    // フォントサイズ (px, SCALE=2なので実際の視覚サイズの2倍)
    const F = SCALE;

    let thRow = `<th style="width:${periodW}px;background:${accent};color:#fff;font-size:${13*F}px;font-weight:800;border:1px solid ${borderCol};padding:${4*F}px ${2*F}px;text-align:center;height:${headerH}px;">時限</th>`;
    weekDayNames.forEach((d,i)=>{
      const dt=dates[i]; const ds=(dt.getMonth()+1)+'/'+dt.getDate();
      thRow+=`<th style="width:${dayW}px;background:${weekDayBgs[i]};color:${weekDayColors[i]};font-size:${18*F}px;font-weight:900;border:1px solid ${borderCol};padding:${3*F}px;text-align:center;line-height:1.3;height:${headerH}px;">${d}<br><span style="font-size:${12*F}px;font-weight:600;opacity:0.75;">${ds}</span></th>`;
    });

    let morningRow=`<td style="background:${isMono?'#f0f0f0':'#fffbeb'};color:${isMono?'#555':'#92400e'};font-size:${11*F}px;font-weight:800;border:1px solid ${borderCol};text-align:center;padding:${2*F}px;line-height:1.4;height:${morningH}px;vertical-align:middle;">朝自習<br><span style="font-size:${10*F}px;">15分</span></td>`;
    weekDayNames.forEach(d=>{
      const id=plan.morningStudy[d]||'';
      const s=SM.get(id);
      morningRow+=`<td style="background:${sBg(id)};color:${sFg(id)};font-size:${13*F}px;font-weight:900;border:1px solid ${borderCol};text-align:center;height:${morningH}px;vertical-align:middle;">${s?s.name:''}</td>`;
    });

    // 備考行
    let remarksRowPDF=`<td style="background:${isMono?'#f4f4f4':'#f0f5ff'};color:${isMono?'#555':accent};font-size:${10*F}px;font-weight:900;border:1px solid ${borderCol};text-align:center;padding:${3*F}px;vertical-align:middle;">備考</td>`;
    weekDayNames.forEach((d,i)=>{
      const dt=dates[DAYS.indexOf(d)];
      const holiday=getHoliday(dt);
      const isOvr=plan.holidayOverride[d];
      const remark=plan.dayRemarks[d]||'';
      const bg=(holiday&&!isOvr)?'#fff5f5':'#fafcff';
      const col=holiday&&!isOvr?'#ef4444':'#333';
      let txt='';
      if(holiday&&!isOvr){
        txt=holiday;
      } else if(remark){
        txt=remark.split('\n').filter(s=>s.trim()).map(s=>`・${s.trim()}`).join('<br>');
      }
      remarksRowPDF+=`<td style="background:${bg};border:1px solid ${borderCol};padding:${3*F}px ${4*F}px;font-size:${11*F}px;color:${col};vertical-align:top;text-align:left;">${txt}</td>`;
    });

    let periodRows='';
    [1,2,3,4,5,6].forEach(p=>{
      let tds=`<td style="background:${isMono?'#f4f4f4':'#f0f5ff'};color:${isMono?'#555':accent};font-size:${16*F}px;font-weight:900;border:1px solid ${borderCol};text-align:center;padding:${3*F}px;height:${cellH}px;vertical-align:middle;">${p}</td>`;
      weekDayNames.forEach(d=>{
        const raw=plan.timetable[d]?.[p]||{subjectId:''};
        const cell=typeof raw==='string'?{subjectId:raw}:raw;
        const s=SM.get(cell.subjectId);
        const bg=sBg(cell.subjectId); const fg=sFg(cell.subjectId);
        // 教科名：少し小さく
        const nmStr=s?s.name:'';
        const nmSize=nmStr.length>=4?`${11*F}px`:nmStr.length===3?`${13*F}px`:`${15*F}px`;
        const nm=s?`<span style="font-size:${nmSize};font-weight:900;line-height:1.1;display:block;text-align:center;width:100%;">${nmStr}</span>`:'';
        const sf="'Helvetica Neue','Arial','Hiragino Kaku Gothic ProN',sans-serif";
        // 単元名：読みやすいフォント・大きく
        const unStr=cell.unitName?esc(cell.unitName):'';
        const unLen=unStr.length;
        const unSize=unLen>=16?`${10*F}px`:unLen>=12?`${11*F}px`:unLen>=8?`${12*F}px`:unLen>=5?`${13*F}px`:`${14*F}px`;
        const un=unStr?`<span style="font-size:${unSize};font-family:${sf};display:block;margin-top:${2*F}px;opacity:0.95;line-height:1.3;max-width:${dayW-6*F}px;word-break:break-all;white-space:normal;text-align:left;">${unStr}</span>`:'';
        // 備考：読みやすいフォント
        const ntStr=cell.note?esc(cell.note):'';
        const ntLen=ntStr.length;
        const ntSize=ntLen>=16?`${8*F}px`:ntLen>=10?`${9*F}px`:ntLen>=6?`${10*F}px`:`${11*F}px`;
        const nt=ntStr?`<span style="font-size:${ntSize};font-family:${sf};display:block;margin-top:${2*F}px;opacity:0.82;line-height:1.3;max-width:${dayW-6*F}px;word-break:break-all;white-space:normal;text-align:left;">${ntStr}</span>`:'';
        tds+=`<td style="background:${bg};border:1px solid ${borderCol};vertical-align:top;min-height:${cellH}px;padding:${2*F}px ${2*F}px;"><div style="display:flex;flex-direction:column;align-items:flex-start;min-height:${cellH}px;color:${fg};padding-top:${2*F}px;">${nm}${un}${nt}</div></td>`;
      });
      periodRows+=`<tr>${tds}</tr>`;
    });

    let summaryRows='';
    [...counts.entries()].sort((a,b)=>totalH(b[1])-totalH(a[1])).forEach(([id,v])=>{
      const s=SM.get(id);if(!s)return;
      const th=totalH(v);
      const thF2=Math.floor(th),thR=Math.round((th-thF2)*3);
      const frac=thR===1?'⅓':thR===2?'⅔':'';
      const ibg=isMono?'#555':s.bg;
      let det=id==='kokugo'&&v.m>0?`通${v.n}+朝${morningFrac(v.m)}h`:`${v.n}コマ`;
      summaryRows+=`<span style="display:inline-flex;align-items:center;gap:${2*F}px;white-space:nowrap;margin-right:${4*F}px;">
        <span style="background:${ibg};color:#fff;border-radius:${3*F}px;width:${16*F}px;height:${16*F}px;display:inline-flex;align-items:center;justify-content:center;font-size:${9*F}px;font-weight:900;">${s.s}</span>
        <span style="font-size:${10*F}px;color:#222;">${s.name}</span>
        <span style="font-size:${12*F}px;font-weight:900;color:#111;">${thF2}${frac}h</span>
        <span style="font-size:${9*F}px;color:#888;">${det}</span>
      </span>`;
    });

    const PAD = Math.round(8 * PX_PER_MM * SCALE);
    const div = document.createElement('div');

    setProgress(30, 'レイアウト構築中');

      setProgress(50, '描画中...');
      const renderDiv = buildRenderDiv();
      setTimeout(()=>{
        html2canvas(renderDiv, {
          scale: 1,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false,
          allowTaint: true
        }).then(canvas => {
          setProgress(85, 'PDF変換中...');
          document.body.removeChild(renderDiv);
          const { jsPDF } = window.jspdf;
          // B5: 182×257mm, 余白8mm → 印刷領域 166×241mm, 上下左右8mmマージン
          const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:[182,257] });
          const imgData = canvas.toDataURL('image/jpeg', 0.97);
          // キャンバスのアスペクト比でY軸を計算
          const imgW = 166;
          const imgH = canvas.height * (imgW / canvas.width);
          pdf.addImage(imgData, 'JPEG', 8, 8, imgW, imgH);
          const mon = fromKey(weekKey);
          const fname = '週案_'+mon.getFullYear()+String(mon.getMonth()+1).padStart(2,'0')+String(mon.getDate()).padStart(2,'0')+'.pdf';
          pdf.save(fname);
          setProgress(100, '完了！');
          setTimeout(()=>document.body.removeChild(overlay), 800);
        }).catch(err=>{
          document.body.removeChild(renderDiv);
          document.body.removeChild(overlay);
          alert('PDF生成に失敗しました: ' + err.message);
        });
      }, 200);
    });
  });
}

// Excel出力（.xlsx）  — SheetJS を CDN から動的ロード
// ============================================================
function exportExcel(){
  document.getElementById("exportMenu").style.display="none";
  const plan = getPlan();
  const mon = fromKey(weekKey);
  const dates = weekDates(mon);
  const isMono = colorMode === "mono";

  function loadSheetJS(cb){
    if(window.XLSX){cb();return;}
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=cb;
    document.head.appendChild(s);
  }

  loadSheetJS(function(){
    const XLSX = window.XLSX;
    const wb = XLSX.utils.book_new();

    // ── シートデータ構築 ──
    const DAY_NAMES = ["月","火","水","木","金","土","日"];
    const aoa = []; // array of arrays

    // 行0: タイトル
    aoa.push([`第${getWeekNumInMonth(mon)}週　週案　${mon.getFullYear()}年度　${settings.grade}年${settings.className||''}組　担任：${settings.teacherName||''}`,"","","","","","","","",""]);

    // 行1: 週
    const weekStr = `${mon.getMonth()+1}月${mon.getDate()}日（月）〜${dates[4].getMonth()+1}月${dates[4].getDate()}日（金）`;
    aoa.push([weekStr,"","","","","","","","",""]);

    // 空行
    aoa.push([]);

    // 行3: ヘッダー行
    aoa.push(["時限", ...DAY_NAMES]);

    // 行4: 朝自習行
    const morningRow = ["朝自習(15分)"];
    DAY_NAMES.forEach(d => {
      const id = plan.morningStudy[d] || "";
      const s = SM.get(id);
      morningRow.push(s ? s.name : "");
    });
    aoa.push(morningRow);

    // 行5〜10: 各時限
    PERIODS.forEach(p => {
      const row = [String(p)];
      DAY_NAMES.forEach(d => {
        const raw = plan.timetable[d]?.[p] || {subjectId:""};
        const cell = typeof raw === "string" ? {subjectId:raw} : raw;
        const s = SM.get(cell.subjectId);
        const subjectName = s ? s.name : "";
        const unit = cell.unitName ? ("\n" + cell.unitName) : "";
        row.push(subjectName + unit);
      });
      aoa.push(row);
    });

    // 備考行
    const remarksRow = ["備考"];
    DAY_NAMES.forEach(d => {
      const dt = dates[DAYS.indexOf(d)];
      const holiday = getHoliday(dt);
      const isOvr = plan.holidayOverride[d];
      const remark = plan.dayRemarks[d] || '';
      remarksRow.push(holiday && !isOvr ? holiday : remark);
    });
    aoa.push(remarksRow);

    // 空行
    aoa.push([]);

    // 時数集計（1行横並び）
    const countEntries = [...countPeriods(plan.timetable, plan.morningStudy).entries()]
      .sort((a,b)=>totalH(b[1])-totalH(a[1]));
    const countHeader = ["【時数】"];
    const countValues = [""];
    countEntries.forEach(([id,v])=>{
      const s=SM.get(id);if(!s)return;
      const th=totalH(v);
      const thF=Math.floor(th),thR=Math.round((th-thF)*3);
      const frac=thR===1?"1/3":thR===2?"2/3":"";
      countHeader.push(s.name);
      let det = id==="kokugo"&&v.m>0 ? `通${v.n}+朝${v.m}回` : `${v.n}コマ`;
      countValues.push(`${thF}${frac}h (${det})`);
    });
    aoa.push(countHeader);
    aoa.push(countValues);

    aoa.push([]); // 旧時数集計の代替（以下は削除）
    if(false){// 旧コード無効化
    aoa.push(["【今週の時数集計】"]);
    const counts = countPeriods(plan.timetable, plan.morningStudy);
    [...counts.entries()].sort((a,b)=>totalH(b[1])-totalH(a[1])).forEach(([id,v])=>{
      const s = SM.get(id); if(!s) return;
      const th = totalH(v);
      const thFull = Math.floor(th);
      const thRem = Math.round((th-thFull)*3);
      const fracStr = thRem===1?"1/3":thRem===2?"2/3":"";
      let detail = `通常${v.n}コマ`;
      if(id==="kokugo"&&v.m>0) detail += `　朝自習${v.m}回(${v.m*15}分)`;
      aoa.push([s.name, thFull+(fracStr?"と"+fracStr:"")+"時間", detail]);
    });

    } // end if(false)

    // メモ行は出力しない

    const ws = XLSX.utils.aoa_to_sheet(aoa);

    // 列幅設定
    ws["!cols"] = [
      {wch:8},  // 時限
      {wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14} // 曜日
    ];

    // 行高設定（時限行は高め）
    ws["!rows"] = [];
    for(let i=0;i<aoa.length;i++){
      ws["!rows"].push({hpx: i>=4&&i<=10 ? 52 : 18});
    }

    // セル結合（タイトル行）
    ws["!merges"] = [
      {s:{r:0,c:0},e:{r:0,c:7}},
      {s:{r:1,c:0},e:{r:1,c:7}},
    ];

    // カラー時：教科セルに背景色を設定
    if(!isMono){
      // 朝自習行 (row 4)
      DAY_NAMES.forEach((d,ci)=>{
        const id=plan.morningStudy[d]||"";
        const s=SM.get(id);
        if(!s)return;
        const addr=XLSX.utils.encode_cell({r:4,c:ci+1});
        if(!ws[addr])ws[addr]={t:"s",v:s.name};
        ws[addr].s={fill:{fgColor:{rgb:s.bg.replace("#","")}},font:{color:{rgb:"FFFFFF"},bold:true},alignment:{horizontal:"center",vertical:"center"}};
      });
      // 時限行 (row 5〜10)
      PERIODS.forEach((p,pi)=>{
        DAY_NAMES.forEach((d,ci)=>{
          const raw=plan.timetable[d]?.[p]||{subjectId:""};
          const cell=typeof raw==="string"?{subjectId:raw}:raw;
          const s=SM.get(cell.subjectId);
          if(!s)return;
          const addr=XLSX.utils.encode_cell({r:5+pi,c:ci+1});
          if(!ws[addr])ws[addr]={t:"s",v:s.name};
          ws[addr].s={fill:{fgColor:{rgb:s.bg.replace("#","")}},font:{color:{rgb:"FFFFFF"},bold:true},alignment:{horizontal:"center",vertical:"center",wrapText:true}};
        });
      });
    }

    // ヘッダー行スタイル
    DAY_NAMES.forEach((d,ci)=>{
      const addr=XLSX.utils.encode_cell({r:3,c:ci+1});
      if(!ws[addr])ws[addr]={t:"s",v:d};
      ws[addr].s={fill:{fgColor:{rgb:"DCE8F8"}},font:{bold:true,color:{rgb:"1E3A5F"}},alignment:{horizontal:"center"}};
    });

    XLSX.utils.book_append_sheet(wb, ws, "週案");
    const fname = `週案_${mon.getFullYear()}${String(mon.getMonth()+1).padStart(2,"0")}${String(mon.getDate()).padStart(2,"0")}.xlsx`;
    XLSX.writeFile(wb, fname);
  });
}

const GAS_URL_KEY  = "gas_backend_url";
const GAS_UID_KEY  = "gas_uid";
const GAS_PASS_KEY = "gas_pass";

// GASのURLを直接埋め込み（ユーザーが入力不要）
const GAS_HARDCODED_URL = "https://script.google.com/macros/s/AKfycbxg_Yk64-pqJX6SZrPGuNp-F-QtAzhvSJBhQrcpwVzZoxLGl8sD4XYc8FuFbkVbH-kr4w/exec";

let gasUid  = localStorage.getItem(GAS_UID_KEY)  || "";
let gasPass = localStorage.getItem(GAS_PASS_KEY) || "";

function getGasUrl(){
  return GAS_HARDCODED_URL;
}

async function gasPost(action, data={}){
  const url = getGasUrl();
  if(!url) return null;
  try{
    let params;
    if(action === "saveData"){
      // データをJSON文字列化
      const dataStr = JSON.stringify(data.data || {});
      params = new URLSearchParams({action, uid:data.uid, pass:data.pass, data:dataStr});
      // URLが長すぎる場合はPOSTにフォールバック
      if((url + "?" + params.toString()).length > 7000){
        const res = await fetch(url, {
          method: "POST",
          headers: {"Content-Type": "application/x-www-form-urlencoded"},
          body: params.toString()
        });
        return await res.json();
      }
    } else {
      params = new URLSearchParams({action, ...data});
    }
    const res = await fetch(url + "?" + params.toString(), {method:"GET"});
    return await res.json();
  }catch(e){
    console.warn("GAS通信エラー:", e);
    return null;
  }
}

function setupGasUrl(){
  const current = getGasUrl();
  const msg = current
    ? "現在のGAS URL:\n" + current + "\n\n新しいURLを入力してください:"
    : "GASウェブアプリのURLを入力してください:\n（例: https://script.google.com/macros/s/xxx/exec）";
  const url = prompt(msg);
  if(!url) return;
  localStorage.setItem(GAS_URL_KEY, url.trim());
  const info = document.getElementById("gasUrlInfo");
  if(info) info.textContent = "✅ URL設定完了";

async function execLogin(){
  const uid  = document.getElementById("loginUid").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  const errEl = document.getElementById("loginError");
  if(!uid || !pass){ errEl.textContent="IDとパスワードを入力してください"; errEl.style.display="block"; return; }
  if(!getGasUrl()){ errEl.textContent="サーバーURLが設定されていません"; errEl.style.display="block"; return; }

  const btn = document.getElementById("loginExecBtn");
  btn.textContent = "⏳ 確認中..."; btn.disabled = true;

  const r = await gasPost("login", {uid, pass});
  btn.textContent = "ログイン"; btn.disabled = false;

  if(!r){ errEl.textContent="サーバーに接続できません"; errEl.style.display="block"; return; }
  if(!r.ok){
    const msg = r.error==="locked"?"このアカウントはロックされています":r.error==="invalid"?"IDまたはパスワードが違います":"ログイン失敗";
    errEl.textContent = msg; errEl.style.display="block"; return;
  }

  // ログイン成功
  gasUid = uid; gasPass = pass;
  localStorage.setItem(GAS_UID_KEY, uid);
  localStorage.setItem(GAS_PASS_KEY, pass);
  document.getElementById("userBadge").textContent = "👤 " + uid;
  document.getElementById("logoutBtn").style.display = "flex";
  const lb = document.getElementById("googleLoginBtn");
  if(lb) lb.style.display = "none";
  hideLoginModal();
  showToast("✅ ログインしました");
  await loadFromServer();
}

async function execRegister(){
  const uid  = document.getElementById("loginUid").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  const errEl = document.getElementById("loginError");
  if(!uid || !pass){ errEl.textContent="IDとパスワードを入力してください"; errEl.style.display="block"; return; }
  if(!getGasUrl()){ errEl.textContent="サーバーURLが設定されていません"; errEl.style.display="block"; return; }

  const regpass = prompt("登録用パスフレーズを入力してください\n（管理者から教えてもらってください）");
  if(!regpass) return;

  const btn = document.getElementById("registerExecBtn");
  btn.textContent = "⏳ 登録中..."; btn.disabled = true;

  const r = await gasPost("register", {uid, pass, regpass});
  btn.textContent = "新規登録"; btn.disabled = false;

  if(!r){ errEl.textContent="サーバーに接続できません"; errEl.style.display="block"; return; }
  if(!r.ok){
    const msg = r.error==="taken"?"そのIDは既に使われています":r.error==="regpass"?"パスフレーズが違います":"登録失敗";
    errEl.textContent = msg; errEl.style.display="block"; return;
  }

  errEl.style.display="none";
  showToast("✅ 登録しました。ログインしてください");
}

  const newUrl = prompt("新しいGASウェブアプリURLを入力してください:\n（例: https://script.google.com/macros/s/xxx/exec）");
  if(!newUrl) return;
  localStorage.setItem(SHEET_URL_KEY, newUrl.trim());
  alert("URLを設定しました。");
}

function fetchSheetCalendar(){
  let url = localStorage.getItem(SHEET_URL_KEY);
  if(!url){
    url = prompt("学年会システムのGASウェブアプリURLを入力してください:\n（例: https://script.google.com/macros/s/xxx/exec）");
    if(!url) return;
    localStorage.setItem(SHEET_URL_KEY, url.trim());
  }
  const mon = fromKey(weekKey);
  // 週開始(月曜)の日付を YYYY-MM-DD 形式で用意（GAS側でスラッシュ/ダッシュ両対応）
  const weekStr = mon.getFullYear() + "-" +
    String(mon.getMonth()+1).padStart(2,"0") + "-" +
    String(mon.getDate()).padStart(2,"0");

  const btn = document.getElementById("sheetFetchBtn");
  btn.textContent = "⏳ 取得中...";
  btn.disabled = true;

  fetch(url + "?action=getCalendar&week=" + weekStr)
    .then(r => r.json())
    .then(data => {
      btn.textContent = "📋 学校カレンダーから取得";
      btn.disabled = false;
      if(!data.ok){ alert("取得失敗: " + (data.error||"不明なエラー")); return; }
      applySheetEventsToRemarks(data.events || []);
    })
    .catch(e => {
      btn.textContent = "📋 学校カレンダーから取得";
      btn.disabled = false;
      alert("通信エラー: " + e.message + "\n\nURL設定をリセットします。");
      localStorage.removeItem(SHEET_URL_KEY);
    });
}

function applySheetEventsToRemarks(events){
  // events: [{day:"月", title:"..."}, ...]
  const plan = getPlan();
  let applied = 0;
  events.forEach(ev => {
    const d = ev.day;
    if(!DAYS.slice(0,5).includes(d)) return;
    const title = (ev.title || "").trim();
    if(!title) return;
    const existing = (plan.dayRemarks[d] || "").trim();
    plan.dayRemarks[d] = existing ? (existing + "\n" + title) : title;
    applied++;
  });
  saveStorage();
  renderRemarks();
  if(applied) alert("学校カレンダーのイベントを" + applied + "件の備考に追加しました。");
  else alert("この週の学校カレンダーイベントはありませんでした。");
}

function connectGoogleCalendar(){
  const clientId = localStorage.getItem(GCAL_CLIENT_ID_KEY);
  if(!clientId){
    const id=prompt("Google Cloud Console で取得した OAuth2 クライアントID を入力してください（例: 1234567890-abcd.apps.googleusercontent.com）");
    if(!id)return;
    localStorage.setItem(GCAL_CLIENT_ID_KEY, id);
  }
  // Google Identity Services でトークンを取得
  if(!window.google?.accounts?.oauth2){ alert("Google認証ライブラリが読み込まれていません。インターネット接続を確認してください。"); return; }
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: localStorage.getItem(GCAL_CLIENT_ID_KEY),
    scope: GCAL_SCOPE,
    callback:(resp)=>{
      if(resp.access_token){
        gcalToken=resp.access_token;
        localStorage.setItem("gcal_token",gcalToken);
        setGCalConnected(true);
        fetchGCalEvents();
      }else{
        alert("Google認証に失敗しました: "+(resp.error||"不明なエラー"));
      }
    }
  });
  tokenClient.requestAccessToken();
}

function setGCalConnected(v){
  gcalConnected=v;
  const btn=document.getElementById("gcalConnectBtn");
  const fetchBtn=document.getElementById("gcalFetchBtn");
  if(v){
    document.getElementById("gcalBtnIcon").textContent="✅";
    document.getElementById("gcalBtnLabel").textContent="カレンダー連携済";
    btn.style.background="#dcfce7"; btn.style.color="#16a34a";
    if(fetchBtn)fetchBtn.style.display="inline-block";
  }else{
    document.getElementById("gcalBtnIcon").textContent="📅";
    document.getElementById("gcalBtnLabel").textContent="カレンダー連携";
    btn.style.background=""; btn.style.color="";
    if(fetchBtn)fetchBtn.style.display="none";
  }
}

async function fetchGCalEvents(){
  if(!gcalToken){connectGoogleCalendar();return;}
  const mon=fromKey(weekKey);
  const sun=new Date(mon);sun.setDate(sun.getDate()+6);
  const timeMin=new Date(mon).toISOString();
  const timeMax=new Date(sun.getTime()+86400000).toISOString();

  let events=[];
  const workerUrl=getWorkerUrl();
  if(workerUrl){
    // Worker経由で取得（CORSを回避）
    const r=await workerPost("getCalendar",{
      auth:{uid:currentUid,pass:currentPass},
      accessToken:gcalToken,
      timeMin,timeMax
    });
    if(r&&r.ok) events=r.events||[];
    else if(r&&r.error==="no_token"){ gcalToken=""; setGCalConnected(false); return; }
    else {
      // Worker未設定の場合は直接取得
      events = await fetchGCalDirect(timeMin,timeMax);
    }
  }else{
    events = await fetchGCalDirect(timeMin,timeMax);
  }
  applyCalendarToRemarks(events);
}

async function fetchGCalDirect(timeMin,timeMax){
  try{
    const url=`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime&maxResults=50`;
    const resp=await fetch(url,{headers:{Authorization:"Bearer "+gcalToken}});
    if(resp.status===401){gcalToken="";localStorage.removeItem("gcal_token");setGCalConnected(false);return[];}
    const data=await resp.json();
    return (data.items||[]).map(e=>({
      id:e.id,
      summary:e.summary||"",
      start:e.start.date||e.start.dateTime,
      allDay:!!e.start.date,
    }));
  }catch{return[];}
}

function applyCalendarToRemarks(events){
  const plan=getPlan();
  const mon=fromKey(weekKey);
  const dates=weekDates(mon);
  let applied=0;
  DAYS.forEach((d,i)=>{
    const dt=dates[i];
    const dKey=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
    const dayEvents=events.filter(e=>e.start&&e.start.startsWith(dKey));
    if(dayEvents.length){
      const existing=(plan.dayRemarks[d]||"").trim();
      const newLines=dayEvents.map(e=>"📅 "+e.summary).join("\n");
      plan.dayRemarks[d]=existing?(existing+"\n"+newLines):newLines;
      applied++;
    }
  });
  saveStorage();
  renderRemarks();
  if(applied) alert("Googleカレンダーのイベントを"+applied+"日分の備考に追加しました。");
  else alert("この週にGoogleカレンダーのイベントはありませんでした。");
}
